<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Link Dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1d2433; }
  input, button { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid #cfd5df; }
  button { background: #2563eb; color: #fff; border: 0; cursor: pointer; }
  .row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  .row input { flex: 1; min-width: 160px; }
  .card { border: 1px solid #e3e7ee; border-radius: 10px; padding: 16px; margin-top: 16px; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 120px; margin-top: 12px; }
  .bar { background: #2563eb; flex: 1; border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
  .bar span { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #6b7280; white-space: nowrap; }
  .muted { color: #6b7280; } .error { color: #b91c1c; }
</style>
</head>
<body>
  <h1>Short links</h1>
  <div class="row">
    <input id="key" placeholder="Your API key (any string locally)" value="me" />
    <input id="api" placeholder="API base URL" />
  </div>
  <div class="card">
    <h3>Create</h3>
    <div class="row">
      <input id="url" placeholder="https://example.com/long/link" />
      <input id="alias" placeholder="custom alias (optional)" />
      <input id="days" type="number" min="1" max="365" placeholder="expires in days" style="max-width:150px" />
      <button id="create">Shorten</button>
    </div>
    <p id="created" class="muted"></p>
  </div>
  <div class="card">
    <h3>Daily clicks</h3>
    <div class="row"><input id="code" placeholder="short code" /><button id="load">Load</button></div>
    <p id="summary" class="muted"></p>
    <div id="bars" class="bars"></div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  $("api").value = location.origin.startsWith("http") ? location.origin : "http://localhost:8000";
  const headers = () => ({ "content-type": "application/json", "x-api-key": $("key").value });

  $("create").onclick = async () => {
    const body = { url: $("url").value };
    if ($("alias").value) body.alias = $("alias").value;
    if ($("days").value) body.expires_in_days = Number($("days").value);
    const res = await fetch(`${$("api").value}/links`, { method: "POST", headers: headers(), body: JSON.stringify(body) });
    const data = await res.json();
    $("created").innerHTML = res.ok
      ? `Created <a href="${data.short_url}" target="_blank">${data.short_url}</a>`
      : `<span class="error">${data.error}</span>`;
    if (res.ok) $("code").value = data.code;
  };

  $("load").onclick = async () => {
    const res = await fetch(`${$("api").value}/links/${$("code").value}/stats`, { headers: headers() });
    const data = await res.json();
    if (!res.ok) { $("summary").innerHTML = `<span class="error">${data.error}</span>`; $("bars").innerHTML = ""; return; }
    $("summary").textContent = `${data.total_clicks} total clicks to ${data.url}`;
    const max = Math.max(1, ...data.daily.map((d) => d.count));
    $("bars").innerHTML = data.daily
      .map((d) => `<div class="bar" title="${d.day}: ${d.count}" style="height:${(d.count / max) * 100}%"><span>${d.day.slice(5)}</span></div>`)
      .join("");
  };
</script>
</body>
</html>
